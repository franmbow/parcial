{% extends "base.html" %}
{% block title %}Formulario{% endblock %}
{% block content %}
    <h3 class="mb-4 text-center">Cargar Nuevo Registro</h3>
    <form method="POST">
        <p><em>El campo ID se genera automáticamente.</em></p>
        <!-- TODO: completar con los campos del modelo -->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" value="{{ dato.nombre if dato else '' }}" name="nombre">
        </div>
        <div class="mb-3">
            <label class="form-label">Edad</label>
            <input type="number" class="form-control" value="{{ dato.edad if dato else '' }}" name="edad">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{ dato.email if dato else '' }}" name="email">
        </div>
        <div class="mb-3">
            <label class="form-label">Ciudad</label>
            <input type="text" class="form-control" value="{{ dato.ciudad if dato else '' }}" name="ciudad">
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('listado') }}" class="btn btn-secondary">Volver</a>
    </form>
{% endblock %}
